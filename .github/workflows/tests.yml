name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # GitHub's macOS runners are sometimes never assigned and the job is cancelled unrun;
    # that must not turn the run red. A real macOS test failure still shows on the job.
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the oldest Python supported (it is what macOS ships); the newest Ubuntu image no longer offers it
          - {os: ubuntu-24.04, python-version: "3.9"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: macos-latest, python-version: "3.13"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest ruff==0.17.5
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
